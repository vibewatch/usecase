name: Enrich company and date evidence

on:
  schedule:
    - cron: "17 02 * * *"
  workflow_dispatch:
    inputs:
      cap:
        description: "Combined company/date research jobs (1-40)"
        required: false
        default: "40"

permissions:
  contents: write

concurrency:
  group: usecase-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.USECASE_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate inputs
        id: inputs
        env:
          RAW_CAP: ${{ github.event.inputs.cap }}
        run: |
          set -euo pipefail
          CAP="${RAW_CAP:-40}"
          if ! [[ "$CAP" =~ ^([1-9]|[1-3][0-9]|40)$ ]]; then
            echo "Invalid cap '$CAP'; expected 1-40." >&2
            exit 2
          fi
          echo "cap=$CAP" >> "$GITHUB_OUTPUT"

      - name: Check enrichment queues
        id: queue
        run: |
          set -euo pipefail
          npm run --silent data:build >/dev/null
          python3 - <<'PY'
          import os
          from pipeline.usecase_intel.company_enrichment import build_research_jobs
          from pipeline.usecase_intel.date_enrichment import build_date_research_jobs

          company = build_research_jobs(write_jobs=False)["jobs"]
          dates = build_date_research_jobs(write_jobs=False)["unresearched"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"company={company}\n")
              output.write(f"dates={dates}\n")
              output.write(f"has_work={'true' if company or dates else 'false'}\n")
          print(f"Unresearched company jobs: {company}; date jobs: {dates}")
          PY

      - name: Install dependencies
        if: steps.queue.outputs.has_work == 'true'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm install -g @github/copilot --no-audit --no-fund
          python3 -m pip install -r requirements.txt

      - name: Run enrichment agent
        if: steps.queue.outputs.has_work == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          set -euo pipefail
          copilot --yolo --autopilot \
            --model gpt-5.4 \
            --effort xhigh \
            --agent "UseCase Enrichment" \
            -p "Research and apply a bounded enrichment batch. Combined cap: ${{ steps.inputs.outputs.cap }}. Follow the source hierarchy strictly, retain Unknown when evidence is insufficient, then validate and rebuild. Do not run git commands."

      - name: Validate enrichment and site
        if: steps.queue.outputs.has_work == 'true'
        run: |
          set -euo pipefail
          python3 -m pipeline.usecase_intel.company_enrichment validate
          npm run data:build
          npm run build

      - name: Commit and push
        if: steps.queue.outputs.has_work == 'true'
        run: |
          set -euo pipefail
          git config user.name "usecase-enrichment-bot"
          git config user.email "usecase-enrichment-bot@users.noreply.github.com"
          BRANCH="${{ github.ref_name }}"
          git add data/company-enrichment.jsonl data/triage.jsonl data/weekly
          if git diff --cached --quiet; then
            echo "No defensible enrichment found in this batch."
            exit 0
          fi
          git commit -m "chore(data): enrich company and date evidence"
          for attempt in $(seq 1 20); do
            git reset -q --hard HEAD
            git fetch -q origin "$BRANCH"
            if ! git rebase -q -X ours "origin/$BRANCH"; then
              git rebase --abort
              echo "Rebase conflict; aborting." >&2
              exit 1
            fi
            npm run --silent data:build >/dev/null
            git add -A data/weekly
            git diff --cached --quiet || git commit -q --amend --no-edit
            if git push -q origin "HEAD:$BRANCH"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            sleep $(( (RANDOM % 30) + attempt * 3 ))
          done
          echo "Could not push after 20 attempts." >&2
          exit 1
