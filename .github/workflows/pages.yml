# Build the dashboard from data/records/** and publish it to GitHub Pages.
#
# Runs on every push to main that touches records or site code — including the
# successful publishing workflows (whose GITHUB_TOKEN pushes do not trigger
# push workflows) — and on demand.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions",
# custom domain usecase.genisisiq.com (DNS: CNAME usecase → vibewatch.github.io).

name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "data/records/**"
      - "data/company-enrichment.jsonl"
      - "data/triage.jsonl"
      - "data/weekly/**"
      - "data/case-studies.sample.json"
      - "pipeline/**"
      - "src/**"
      - "public/**"
      - "taxonomy.json"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "UseCase Intel — discover, extract, and publish records"
      - "Enrich company and date evidence"
      - "Newsroom — AI use cases from company websites"
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # workflow_run.head_sha precedes any data committed by that run.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          python3 -m pip install -r requirements.txt

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build dataset
        run: npm run data:build

      - name: Build site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
